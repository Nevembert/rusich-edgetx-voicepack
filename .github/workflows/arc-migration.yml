name: One-time Arc Warden migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arc-migration.yml'
permissions:
  contents: write
  actions: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify original page and archives
        run: python .github/arc-migrate.py
      - name: Commit transferred page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- segl7hd
          git commit -m 'Add Arc Warden voice pack to GitHub Pages'
          git push origin HEAD:main
      - name: Deploy through the existing Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
