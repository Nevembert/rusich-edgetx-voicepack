name: Publish Arc Warden Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: arcwarden-pages
  cancel-in-progress: false
jobs:
  publish:
    # A repository has one Pages site. Keep Rusich's existing site intact.
    if: github.repository != 'Nevembert/rusich-edgetx-voicepack'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/voicepack.py build-site
      - run: python tools/voicepack.py source-zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
